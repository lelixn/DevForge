version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devforge-postgres
    restart: always
    environment:
      POSTGRES_DB: devforge
      POSTGRES_USER: devforge_user
      POSTGRES_PASSWORD: devforge_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devforge_user -d devforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devforge-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/devforge
      SPRING_DATASOURCE_USERNAME: devforge_user
      SPRING_DATASOURCE_PASSWORD: devforge_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
