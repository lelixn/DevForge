spring:
  profiles:
    active: dev
  application:
    name: devforge-backend
  main:
    allow-bean-definition-overriding: true

server:
  port: 5000
  servlet:
    context-path: /

devforge:
  jwt:
    secret: 9a6f8b1c4e7d2a5b8c3f6e9d2a5b8c1f4e7d2a5b8c3f6e9d2a5b8c1f4e7d2a5b8c3f6e9d2a5b8c1f4e7d2a5b8c3f6e9d2a5b8c1f4e7d2a5b8c3f6e9d2a5b
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://localhost:5000"
    allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
